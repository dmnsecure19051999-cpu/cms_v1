services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      # Database 'cms_db' must be created manually after first start:
      # docker exec cms-sqlserver-1 /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DB_PASSWORD" -No -Q "CREATE DATABASE cms_db"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
